services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nilai
      POSTGRES_PASSWORD: nilai
      POSTGRES_DB: nilai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nilai -d nilai"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://nilai:nilai@db:5432/nilai
    ports:
      - "3000:3000"

  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://nilai:nilai@db:5432/nilai
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  dev_node_modules:
