services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nilai
      POSTGRES_PASSWORD: nilai
      POSTGRES_DB: nilai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nilai -d nilai"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://nilai:nilai@db:5432/nilai
    ports:
      - "3000:3000"

  dev:
    profiles: ["dev"]
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python manage.py migrate --noinput && python manage.py seed && python manage.py runserver 0.0.0.0:3000"
    volumes:
      - .:/app
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://nilai:nilai@db:5432/nilai
      DJANGO_DEBUG: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
